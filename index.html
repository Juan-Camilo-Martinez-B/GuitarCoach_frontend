<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f2e7" />
    <title>GuitarCoach AI</title>
    <script>
      (function () {
        var choice = "light";
        try {
          var stored = localStorage.getItem("guitarcoach-theme");
          if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
        } catch (error) {}
        document.documentElement.dataset.theme = choice;
        var dark =
          choice === "dark" ||
          (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#15100c" : "#f8f2e7");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
