name: ci

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format
      - name: Pruebas
        run: npm test
      - name: Compilación
        run: npm run build
