name: ci

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format
      - name: Pruebas
        run: npm test
      - name: Compilación
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador
        # La API se simula en e2e/support/mockApi.ts: no hace falta backend ni base.
        run: npm run e2e
